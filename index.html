<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d1117" />
<title>MD Reader</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
<link rel="stylesheet" id="hljs-light" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" disabled>
<link rel="stylesheet" id="hljs-dark" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>

<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-2: #1c2128;
    --surface-3: #262c36;
    --border: #30363d;
    --border-soft: #21262d;
    --fg: #e6edf3;
    --fg-muted: #8b949e;
    --fg-dim: #6e7681;
    --accent: #58a6ff;
    --accent-2: #1f6feb;
    --accent-soft: rgba(88,166,255,0.12);
    --code-bg: #161b22;
    --sel: #264f78;
    --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  [data-theme="light"] {
    --bg: #ffffff;
    --surface: #f6f8fa;
    --surface-2: #eef1f4;
    --surface-3: #e4e8ec;
    --border: #d0d7de;
    --border-soft: #e4e8ec;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-dim: #8c959f;
    --accent: #0969da;
    --accent-2: #0969da;
    --accent-soft: rgba(9,105,218,0.1);
    --code-bg: #f6f8fa;
    --sel: #b6d7ff;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    overscroll-behavior: none;
    overflow-x: clip;
  }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.65 var(--font-ui);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--sel); color: var(--fg); }

  /* ============================================================
     Layout
     ============================================================ */
  .app {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    height: 100dvh;
  }
  body.toc-open.wide .app {
    grid-template-columns: 280px minmax(0, 1fr) 260px;
  }

  aside.side {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden; min-width: 0;
  }

  aside.toc {
    background: var(--surface);
    border-left: 1px solid var(--border);
    overflow-y: auto; overflow-x: hidden;
    padding: 14px 8px; display: none; min-width: 0;
  }
  body.toc-open.wide aside.toc { display: block; }

  @media (max-width: 1100px) {
    .app { grid-template-columns: minmax(0, 1fr) !important; }
    aside.side {
      position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 40;
      transform: translateX(-100%);
      transition: transform .2s ease;
      box-shadow: 4px 0 24px rgba(0,0,0,.4);
    }
    aside.side.open { transform: none; }
    aside.toc {
      position: fixed; inset: 0 0 0 auto; width: 280px; z-index: 40;
      transform: translateX(100%);
      transition: transform .2s ease;
      display: block; box-shadow: -4px 0 24px rgba(0,0,0,.4);
    }
    aside.toc.open { transform: none; }
    #openFolder { display: none !important; }
  }

  /* ============================================================
     Sidebar
     ============================================================ */
  .side-head {
    padding: 14px 14px 12px;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--border-soft);
  }
  .brand {
    font-weight: 700; letter-spacing: -.02em; flex: 1;
    font-size: 15px; color: var(--fg);
  }
  .brand span { color: var(--fg-muted); font-weight: 500; }

  .icon-btn {
    width: 32px; height: 32px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--fg-muted);
    border: 1px solid transparent; border-radius: 6px;
    cursor: pointer; transition: background .12s, color .12s, border-color .12s;
  }
  .icon-btn:hover {
    background: var(--surface-2); color: var(--fg);
  }
  .icon-btn:active { background: var(--surface-3); }
  .icon-btn svg { width: 16px; height: 16px; }

  .search-wrap {
    padding: 10px 12px;
    position: relative;
  }
  .search-wrap svg {
    position: absolute; left: 22px; top: 50%;
    transform: translateY(-50%);
    width: 14px; height: 14px; color: var(--fg-dim);
    pointer-events: none;
  }
  .search {
    width: 100%; padding: 8px 10px 8px 32px;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; outline: none;
    transition: border-color .12s, box-shadow .12s;
    -webkit-appearance: none; appearance: none;
  }
  .search::placeholder { color: var(--fg-dim); }
  .search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .tree {
    overflow-y: auto; overflow-x: hidden;
    padding: 4px 8px 8px; flex: 1; min-width: 0;
  }
  .tree::-webkit-scrollbar { width: 8px; }
  .tree::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .tree .folder {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 8px 4px; font-size: 11px; font-weight: 600;
    color: var(--fg-dim);
    text-transform: uppercase; letter-spacing: .06em;
  }
  .tree .folder svg { width: 12px; height: 12px; flex-shrink: 0; }

  .tree .file {
    position: relative;
    display: flex; align-items: center; gap: 8px;
    width: 100%; text-align: left;
    background: none; border: 0;
    color: var(--fg-muted);
    padding: 7px 10px; border-radius: 6px;
    cursor: pointer; font: inherit; font-size: 13px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background .1s, color .1s;
  }
  .tree .file svg {
    width: 14px; height: 14px; flex-shrink: 0;
    opacity: .6;
  }
  .tree .file:hover { background: var(--surface-2); color: var(--fg); }
  .tree .file:hover svg { opacity: 1; }
  .tree .file:active { background: var(--surface-3); }
  .tree .file.active {
    background: var(--accent-soft); color: var(--fg);
    font-weight: 600;
  }
  .tree .file.active svg { opacity: 1; color: var(--accent); }
  .tree .file.active::before {
    content: ""; position: absolute;
    left: 0; top: 6px; bottom: 6px; width: 2px;
    background: var(--accent);
    border-radius: 0 2px 2px 0;
  }
  .tree .file-name {
    overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .tree .empty-tree {
    padding: 20px 12px; text-align: center;
    font-size: 13px; color: var(--fg-dim);
  }

  .side-foot {
    padding: 10px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    border-top: 1px solid var(--border-soft);
  }

  /* ============================================================
     Buttons
     ============================================================ */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--surface-2); color: var(--fg);
    border: 1px solid var(--border);
    padding: 7px 12px; border-radius: 6px;
    font: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
    transition: background .12s, border-color .12s;
  }
  .btn:hover { background: var(--surface-3); }
  .btn:active { background: var(--surface-3); transform: translateY(1px); }
  .btn svg { width: 14px; height: 14px; flex-shrink: 0; }

  .btn.primary {
    background: var(--accent-2);
    border-color: var(--accent-2);
    color: #fff;
  }
  .btn.primary:hover { background: #2d7ff0; border-color: #2d7ff0; }

  .btn.ghost {
    background: transparent; border-color: transparent;
    color: var(--fg-muted);
  }
  .btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
  .btn.full { width: 100%; }

  /* ============================================================
     Main
     ============================================================ */
  main { display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

  header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    padding-top: max(10px, env(safe-area-inset-top));
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
    min-width: 0;
  }
  header .btn, header .icon-btn { flex-shrink: 0; }

  .filename {
    flex: 1; min-width: 0;
    font-size: 12.5px; font-weight: 500;
    color: var(--fg-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: var(--font-mono);
    padding: 0 4px;
  }
  .filename.empty { color: var(--fg-dim); font-family: var(--font-ui); font-weight: 400; }

  .hamburger { display: none; }
  @media (max-width: 1100px) {
    .hamburger { display: inline-flex; }
    header { gap: 6px; padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top)); }
    .btn { padding: 7px 10px; font-size: 12.5px; }
    .btn .label { display: none; }
    .btn.has-icon { padding: 7px 9px; }
  }

  /* ============================================================
     Content
     ============================================================ */
  .content {
    overflow: auto; scroll-behavior: smooth; min-width: 0;
    padding: 32px 28px 100px;
  }
  .content::-webkit-scrollbar { width: 10px; height: 10px; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  .content::-webkit-scrollbar-thumb:hover { background: var(--surface-3); }

  .doc {
    max-width: 780px; margin: 0 auto;
    min-width: 0; overflow-wrap: anywhere;
    user-select: text;
    -webkit-user-select: text;
  }

  @media (max-width: 1100px) {
    .content { padding: 20px 16px 80px; }
  }

  /* ============================================================
     Empty state
     ============================================================ */
  .empty {
    max-width: 440px; margin: 8vh auto 0;
    text-align: center; color: var(--fg-muted);
    padding: 40px 24px;
  }
  .empty-glyph {
    width: 56px; height: 56px; margin: 0 auto 18px;
    border-radius: 14px;
    background: var(--accent-2);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 20px;
    font-family: var(--font-mono); letter-spacing: -.05em;
  }
  .empty h2 {
    color: var(--fg); margin: 0 0 8px;
    font-size: 20px; font-weight: 700; letter-spacing: -.02em;
  }
  .empty p {
    margin: 0 0 22px; font-size: 14px; line-height: 1.6;
    color: var(--fg-muted);
  }
  .empty-actions {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  }
  .empty.drag {
    background: var(--accent-soft);
    border-radius: 12px;
    outline: 2px dashed var(--accent);
    outline-offset: 8px;
  }

  /* ============================================================
     Markdown typography
     ============================================================ */
  .doc h1, .doc h2, .doc h3, .doc h4 {
    line-height: 1.25; font-weight: 700; letter-spacing: -.02em;
    margin: 2em 0 .65em; color: var(--fg);
    scroll-margin-top: 70px;
  }
  .doc > h1:first-child, .doc > h2:first-child, .doc > h3:first-child {
    margin-top: 0;
  }
  .doc h1 { font-size: 2em; padding-bottom: .35em; border-bottom: 1px solid var(--border); }
  .doc h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border-soft); }
  .doc h3 { font-size: 1.2em; }
  .doc h4 { font-size: 1em; color: var(--fg-muted); }

  .doc p, .doc ul, .doc ol, .doc blockquote, .doc table, .doc pre { margin: 0 0 1em; }
  .doc a {
    color: var(--accent); text-decoration: none;
  }
  .doc a:hover { text-decoration: underline; }

  .doc ul, .doc ol { padding-left: 1.6em; }
  .doc li + li { margin-top: .25em; }
  .doc li > p { margin: 0 0 .5em; }

  .doc blockquote {
    border-left: 3px solid var(--border);
    color: var(--fg-muted); padding: 2px 0 2px 1em;
    margin-left: 0; margin-right: 0;
  }

  .doc code {
    background: var(--code-bg); padding: .18em .42em;
    border-radius: 5px; border: 1px solid var(--border-soft);
    font: 85%/1.5 var(--font-mono);
  }
  .doc pre {
    background: var(--code-bg);
    padding: 14px 16px; border-radius: 8px;
    overflow: auto; border: 1px solid var(--border);
    max-width: 100%;
  }
  .doc pre code {
    background: none; padding: 0; border: 0;
    font-size: 13px; line-height: 1.6;
  }

  .doc table {
    border-collapse: collapse;
    display: block; overflow: auto; max-width: 100%;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px;
  }
  .doc th, .doc td {
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    padding: 8px 14px;
  }
  .doc th:last-child, .doc td:last-child { border-right: 0; }
  .doc tr:last-child td { border-bottom: 0; }
  .doc th {
    background: var(--surface-2); font-weight: 600;
    text-align: left; color: var(--fg);
  }

  .doc img, .doc video, .doc svg {
    max-width: 100%; height: auto;
    border-radius: 8px;
  }
  .doc hr {
    border: 0; border-top: 1px solid var(--border);
    margin: 2.5em 0;
  }
  .doc input[type="checkbox"] {
    margin-right: .5em;
    accent-color: var(--accent-2);
    transform: translateY(1px);
  }
  .doc .task-list-item { list-style: none; margin-left: -1.5em; }

  .doc .katex-display {
    overflow-x: auto; overflow-y: hidden;
    padding: 8px 0; max-width: 100%;
  }
  .doc .katex { font-size: 1.05em; }

  /* ============================================================
     TOC
     ============================================================ */
  .toc-title {
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--fg-dim);
    padding: 4px 12px 10px;
  }
  .toc-list { display: flex; flex-direction: column; gap: 1px; }
  .toc a {
    position: relative;
    display: block; padding: 6px 12px;
    border-radius: 6px;
    color: var(--fg-muted); text-decoration: none;
    font-size: 12.5px; line-height: 1.4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background .1s, color .1s;
  }
  .toc a:hover { background: var(--surface-2); color: var(--fg); }
  .toc a.lvl-1 { color: var(--fg); font-weight: 600; }
  .toc a.lvl-2 { padding-left: 12px; }
  .toc a.lvl-3 { padding-left: 24px; font-size: 12px; }
  .toc a.lvl-4 { padding-left: 36px; font-size: 12px; color: var(--fg-dim); }
  .toc a.active {
    background: var(--accent-soft); color: var(--fg);
    font-weight: 600;
  }
  .toc a.active::before {
    content: ""; position: absolute;
    left: 0; top: 6px; bottom: 6px;
    width: 2px;
    background: var(--accent);
    border-radius: 0 2px 2px 0;
  }
  .toc-empty {
    padding: 12px; text-align: center;
    font-size: 12px; color: var(--fg-dim);
  }

  /* ============================================================
     Scrim
     ============================================================ */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 35; display: none;
  }
  .scrim.show { display: block; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div class="app">
  <aside class="side" id="sidebar">
    <div class="side-head">
      <div class="brand">MD <span>Reader</span></div>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </button>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input type="search" class="search" id="search" placeholder="Search files…" autocomplete="off" />
    </div>

    <div class="tree" id="tree"></div>

    <div class="side-foot">
      <button class="btn ghost" id="clearBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/>
        </svg>
        <span>Clear</span>
      </button>
      <button class="btn ghost" id="openFolderSide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        </svg>
        <span>Folder</span>
      </button>
    </div>
  </aside>

  <main>
    <header>
      <button class="icon-btn hamburger" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <button class="btn primary has-icon" id="openFiles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
        </svg>
        <span class="label">Open files</span>
      </button>
      <button class="btn has-icon" id="openFolder" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        </svg>
        <span class="label">Open folder</span>
      </button>
      <div class="filename empty" id="filename">No file loaded</div>
      <button class="btn primary has-icon" id="installBtn" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>
        </svg>
        <span class="label">Install</span>
      </button>
      <button class="icon-btn" id="tocBtn" aria-label="Outline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h12M4 18h8"/>
        </svg>
      </button>
    </header>

    <div class="content" id="content">
      <div class="empty" id="empty">
        <div class="empty-glyph">MD</div>
        <h2>No files yet</h2>
        <p>Drop a Markdown file, or open your project folder. Everything stays local to your device.</p>
        <div class="empty-actions">
          <button class="btn primary" id="emptyOpenFiles">Open files</button>
          <button class="btn" id="emptyOpenFolder">Open folder</button>
        </div>
      </div>
      <div class="doc" id="doc" hidden></div>
    </div>
  </main>

  <aside class="toc" id="toc">
    <div class="toc-title">On this page</div>
    <div class="toc-list" id="tocList"></div>
  </aside>
</div>

<div class="scrim" id="scrim"></div>

<input type="file" id="fileInput" multiple accept=".md,.markdown,.mdx,.txt" hidden />
<input type="file" id="folderInput" webkitdirectory multiple hidden />

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }

  window.addEventListener('load', init);

  /* ============================================================
     IndexedDB wrapper
     ============================================================ */
  const DB = 'md-reader', DBV = 1;
  function idb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB, DBV);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'path' });
        if (!db.objectStoreNames.contains('meta'))  db.createObjectStore('meta');
      };
      r.onsuccess = () => res(r.result);
      r.onerror   = () => rej(r.error);
    });
  }
  const idbTx = async (store, mode, fn) => {
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, mode);
      const req = fn(tx.objectStore(store));
      tx.oncomplete = () => res(req && req.result);
      tx.onerror = () => rej(tx.error);
    });
  };
  const idbPut    = (s, v, k) => idbTx(s, 'readwrite', (os) => k === undefined ? os.put(v) : os.put(v, k));
  const idbGet    = (s, k)    => idbTx(s, 'readonly',  (os) => os.get(k));
  const idbGetAll = (s)       => idbTx(s, 'readonly',  (os) => os.getAll());
  const idbClear  = (s)       => idbTx(s, 'readwrite', (os) => os.clear());

  /* ============================================================
     Init
     ============================================================ */
  function init() {
    const md = window.markdownit({ html: true, linkify: true, typographer: true, breaks: false,
      highlight(str, lang) {
        if (lang && window.hljs && hljs.getLanguage(lang)) {
          try { return hljs.highlight(str, { language: lang }).value; } catch {}
        }
        return '';
      },
    });

    md.core.ruler.after('inline', 'gfm-task-list', (state) => {
      const t = state.tokens;
      for (let i = 2; i < t.length; i++) {
        if (t[i].type !== 'inline' || t[i-2].type !== 'list_item_open') continue;
        const first = t[i].children[0];
        if (first && first.type === 'text') {
          const m = first.content.match(/^\[([ xX])\]\s+/);
          if (m) {
            first.content = first.content.slice(m[0].length);
            const box = new state.Token('html_inline', '', 0);
            box.content = `<input type="checkbox" disabled ${m[1].toLowerCase()==='x'?'checked':''}>`;
            t[i].children.unshift(box);
            t[i-2].attrJoin('class', 'task-list-item');
          }
        }
      }
    });

    /* ---- KaTeX ---- */
    const esc = md.utils.escapeHtml;
    const renderMath = (src, displayMode) => {
      if (!window.katex) return esc(src);
      try { return katex.renderToString(src, { displayMode, throwOnError: false, output: 'html' }); }
      catch { return esc(src); }
    };
    md.inline.ruler.after('escape', 'math_inline', (state, silent) => {
      const s = state.pos;
      if (state.src[s] !== '$' || state.src[s+1] === '$') return false;
      let p = s + 1;
      while (p < state.posMax) {
        const c = state.src[p];
        if (c === '\\') { p += 2; continue; }
        if (c === '\n') return false;
        if (c === '$') break;
        p++;
      }
      if (p >= state.posMax || state.src[p] !== '$') return false;
      const content = state.src.slice(s+1, p);
      if (!content.trim()) return false;
      if (!silent) { const tk = state.push('math_inline', 'math', 0); tk.content = content; }
      state.pos = p + 1;
      return true;
    });
    md.renderer.rules.math_inline = (t, i) => renderMath(t[i].content, false);

    md.block.ruler.before('fence', 'math_block', (state, startLine, endLine, silent) => {
      const pos = state.bMarks[startLine] + state.tShift[startLine];
      const max = state.eMarks[startLine];
      if (pos + 2 > max || state.src.slice(pos, pos+2) !== '$$') return false;
      const firstLine = state.src.slice(pos + 2, max);
      if (firstLine.trim().endsWith('$$') && firstLine.trim().length > 2) {
        if (silent) return true;
        const tk = state.push('math_block', 'math', 0);
        tk.content = firstLine.trim().slice(0, -2);
        tk.block = true;
        state.line = startLine + 1;
        return true;
      }
      let found = false, lastLine = 0, lastPos = 0;
      for (let n = startLine + 1; n < endLine; n++) {
        const p = state.bMarks[n] + state.tShift[n];
        const m = state.eMarks[n];
        const idx = state.src.slice(p, m).indexOf('$$');
        if (idx >= 0) { lastLine = n; lastPos = p + idx; found = true; break; }
      }
      if (!found) return false;
      if (silent) return true;
      const tk = state.push('math_block', 'math', 0);
      tk.content = state.src.slice(pos + 2, lastPos);
      tk.block = true;
      state.line = lastLine + 1;
      return true;
    });
    md.renderer.rules.math_block = (t, i) => '<p>' + renderMath(t[i].content, true) + '</p>\n';

    /* ============================================================
       State
       ============================================================ */
    const files = new Map();
    let current = null;
    let searchQuery = '';

    const $ = (id) => document.getElementById(id);
    const docEl = $('doc'), emptyEl = $('empty'), filenameEl = $('filename');
    const treeEl = $('tree'), contentEl = $('content');
    const sidebar = $('sidebar'), tocEl = $('toc'), tocListEl = $('tocList');
    const scrim = $('scrim'), searchEl = $('search');

    const mq = window.matchMedia('(max-width: 1100px)');
    const isNarrow = () => mq.matches;
    const applyWide = () => {
      document.body.classList.toggle('wide', !isNarrow());
      if (isNarrow()) closeDrawers();
    };
    mq.addEventListener('change', applyWide);
    applyWide();

    function closeDrawers() {
      sidebar.classList.remove('open');
      tocEl.classList.remove('open');
      scrim.classList.remove('show');
    }
    function openSide() {
      sidebar.classList.add('open');
      tocEl.classList.remove('open');
      scrim.classList.add('show');
    }
    function openTocDrawer() {
      tocEl.classList.add('open');
      sidebar.classList.remove('open');
      scrim.classList.add('show');
    }
    scrim.onclick = closeDrawers;

    /* ============================================================
       File loading
       ============================================================ */
    async function loadFiles(list) {
      const jobs = [];
      const added = [];
      for (const f of list) {
        const path = (f.webkitRelativePath || f.name).replace(/^\/+/, '');
        if (!/\.(md|markdown|mdx|txt)$/i.test(path)) continue;
        jobs.push(new Promise((resolve) => {
          const r = new FileReader();
          r.onload = () => {
            files.set(path, { name: path, content: r.result });
            added.push({ path, content: r.result, savedAt: Date.now() });
            resolve();
          };
          r.onerror = resolve;
          r.readAsText(f);
        }));
      }
      await Promise.all(jobs);
      for (const rec of added) idbPut('files', rec).catch(() => {});
      return added.length;
    }

    const SKIP_DIRS = new Set(['node_modules', '.git', '.next', 'dist', 'build', 'out', '.cache', 'coverage', 'vendor', '.venv', 'venv', '__pycache__', '.idea', '.vscode']);

    async function walkHandle(dirHandle, prefix, out, depth = 0) {
      if (depth > 8) return;
      for await (const [name, handle] of dirHandle.entries()) {
        if (handle.kind === 'file') {
          if (/\.(md|markdown|mdx|txt)$/i.test(name)) {
            out.push({ handle, path: prefix + name });
          }
        } else if (handle.kind === 'directory') {
          if (SKIP_DIRS.has(name) || name.startsWith('.')) continue;
          await walkHandle(handle, prefix + name + '/', out, depth + 1);
        }
      }
    }

    async function pickFolderFS() {
      if (!window.showDirectoryPicker) return false;
      try {
        const dirHandle = await window.showDirectoryPicker({ mode: 'read' });
        const entries = [];
        await walkHandle(dirHandle, '', entries);
        if (!entries.length) return true;

        const collected = [];
        for (const { handle, path } of entries) {
          try {
            const f = await handle.getFile();
            Object.defineProperty(f, 'webkitRelativePath', { value: path, configurable: true });
            collected.push(f);
          } catch {}
        }
        await loadFiles(collected);
        renderTree();
        if (!current && files.size) {
          const readme = [...files.keys()].find((p) => /readme\.md$/i.test(p));
          showFile(readme || [...files.keys()][0]);
        }
        return true;
      } catch (e) {
        if (e && e.name === 'AbortError') return true;
        return false;
      }
    }

    function renderTree() {
      treeEl.innerHTML = '';
      const q = searchQuery.trim().toLowerCase();
      const allPaths = [...files.keys()].sort();
      const paths = q ? allPaths.filter((p) => p.toLowerCase().includes(q)) : allPaths;

      if (!paths.length) {
        const div = document.createElement('div');
        div.className = 'empty-tree';
        div.textContent = q ? 'No matches' : 'No files loaded yet';
        treeEl.appendChild(div);
        return;
      }

      const fileIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>`;
      const folderIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`;

      let lastDir = null;
      for (const p of paths) {
        const parts = p.split('/');
        const dir = parts.length > 1 ? parts.slice(0, -1).join('/') : null;
        if (dir && dir !== lastDir) {
          const d = document.createElement('div');
          d.className = 'folder';
          d.innerHTML = folderIcon + `<span>${dir}</span>`;
          treeEl.appendChild(d);
          lastDir = dir;
        }
        const b = document.createElement('button');
        b.className = 'file' + (p === current ? ' active' : '');
        b.title = p;
        b.dataset.path = p;
        b.innerHTML = fileIcon + `<span class="file-name">${parts[parts.length - 1]}</span>`;
        b.onclick = () => showFile(p);
        treeEl.appendChild(b);
      }
    }

    /* ============================================================
       Routing
       ============================================================ */
    function readHash() {
      const h = location.hash;
      if (!h.startsWith('#/')) return null;
      try { return decodeURI(h.slice(2)); } catch { return null; }
    }
    function setHash(path, replace = false) {
      const next = '#/' + encodeURI(path);
      if (location.hash === next) return;
      if (replace) history.replaceState(null, '', next);
      else location.hash = next;
    }
    window.addEventListener('hashchange', () => {
      const p = readHash();
      if (p && files.has(p) && p !== current) showFile(p, { updateHash: false });
    });

    /* ============================================================
       TOC
       ============================================================ */
    function headingText(h) {
      const clone = h.cloneNode(true);
      clone.querySelectorAll('.katex-mathml').forEach((n) => n.remove());
      return clone.textContent.trim();
    }
    function slugify(s) {
      return s.toLowerCase().trim()
        .replace(/[^\w\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '')
        .slice(0, 80) || 'section';
    }

    function buildTOC() {
      const hs = docEl.querySelectorAll('h1, h2, h3, h4');
      const used = new Map();
      const toc = [];
      hs.forEach((h) => {
        const level = +h.tagName[1];
        let slug = slugify(headingText(h));
        if (used.has(slug)) {
          const n = used.get(slug) + 1;
          used.set(slug, n);
          slug = `${slug}-${n}`;
        } else used.set(slug, 0);
        h.id = slug;
        toc.push({ level, text: headingText(h), id: slug });
      });

      tocListEl.innerHTML = '';
      if (!toc.length) {
        const d = document.createElement('div');
        d.className = 'toc-empty';
        d.textContent = 'No headings';
        tocListEl.appendChild(d);
        return toc;
      }
      for (const item of toc) {
        const a = document.createElement('a');
        a.href = '#' + item.id;
        a.className = 'lvl-' + item.level;
        a.textContent = item.text;
        a.dataset.id = item.id;
        a.onclick = (e) => {
          e.preventDefault();
          const el = document.getElementById(item.id);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          if (isNarrow()) closeDrawers();
        };
        tocListEl.appendChild(a);
      }
      return toc;
    }

    let scrollSpy = null;
    function setupScrollSpy() {
      if (scrollSpy) scrollSpy.disconnect();
      const headings = docEl.querySelectorAll('h1, h2, h3, h4');
      if (!headings.length) return;
      const map = new Map();
      tocListEl.querySelectorAll('a').forEach((a) => map.set(a.dataset.id, a));
      scrollSpy = new IntersectionObserver((entries) => {
        entries.forEach((en) => {
          const a = map.get(en.target.id);
          if (!a) return;
          if (en.isIntersecting) {
            tocListEl.querySelectorAll('a.active').forEach((x) => x.classList.remove('active'));
            a.classList.add('active');
          }
        });
      }, { root: contentEl, rootMargin: '-70px 0px -70% 0px', threshold: 0 });
      headings.forEach((h) => scrollSpy.observe(h));
    }

    /* ============================================================
       Show file
       ============================================================ */
    function showFile(path, { updateHash = true } = {}) {
      const f = files.get(path);
      if (!f) return;
      current = path;
      filenameEl.textContent = path;
      filenameEl.classList.remove('empty');
      docEl.innerHTML = md.render(f.content);
      docEl.hidden = false;
      emptyEl.hidden = true;
      contentEl.scrollTop = 0;

      buildTOC();
      setupScrollSpy();

      if (!isNarrow() && tocListEl.children.length) document.body.classList.add('toc-open');

      renderTree();
      if (isNarrow()) closeDrawers();
      if (updateHash) setHash(path);

      idbPut('meta', path, 'lastFile').catch(() => {});

      docEl.querySelectorAll('a[href]').forEach((a) => {
        const href = a.getAttribute('href');
        if (!href || /^(https?:|mailto:|#)/.test(href)) return;
        a.addEventListener('click', (e) => {
          const target = resolvePath(current, href.split('#')[0]);
          if (files.has(target)) { e.preventDefault(); showFile(target); }
          else a.title = `Not loaded: ${target}`;
        });
      });
    }

    function resolvePath(fromPath, rel) {
      if (!rel.startsWith('.')) return rel;
      const fromDir = fromPath.includes('/') ? fromPath.slice(0, fromPath.lastIndexOf('/')) : '';
      const parts = (fromDir + '/' + rel).split('/');
      const out = [];
      for (const p of parts) {
        if (p === '' || p === '.') continue;
        if (p === '..') out.pop(); else out.push(p);
      }
      return out.join('/');
    }

    /* ============================================================
       UI wiring
       ============================================================ */
    $('openFiles').onclick = () => $('fileInput').click();
    $('emptyOpenFiles').onclick = () => $('fileInput').click();

    const folderSupported = !!window.showDirectoryPicker || ('webkitdirectory' in document.createElement('input'));
    const folderBtn = $('openFolder');
    const folderBtnSide = $('openFolderSide');
    const emptyFolderBtn = $('emptyOpenFolder');

    if (folderSupported) {
      folderBtn.style.display = '';
      folderBtnSide.style.display = '';
      emptyFolderBtn.style.display = '';
    } else {
      folderBtn.style.display = 'none';
      folderBtnSide.style.display = 'none';
      emptyFolderBtn.style.display = 'none';
    }

    async function handleFolderClick() {
      if (window.showDirectoryPicker) {
        const ok = await pickFolderFS();
        if (ok) return;
      }
      if ('webkitdirectory' in document.createElement('input')) {
        $('folderInput').click();
      }
    }
    folderBtn.onclick = handleFolderClick;
    folderBtnSide.onclick = handleFolderClick;
    emptyFolderBtn.onclick = handleFolderClick;

    $('menuBtn').onclick = () => sidebar.classList.contains('open') ? closeDrawers() : openSide();

    $('tocBtn').onclick = () => {
      if (isNarrow()) {
        tocEl.classList.contains('open') ? closeDrawers() : openTocDrawer();
      } else {
        document.body.classList.toggle('toc-open');
      }
    };

    $('fileInput').addEventListener('change', async (e) => {
      await loadFiles(e.target.files);
      renderTree();
      if (!current && files.size) {
        const readme = [...files.keys()].find((p) => /readme\.md$/i.test(p));
        showFile(readme || [...files.keys()][0]);
      }
      e.target.value = '';
    });

    $('folderInput').addEventListener('change', async (e) => {
      await loadFiles(e.target.files);
      renderTree();
      if (!current && files.size) {
        const readme = [...files.keys()].find((p) => /readme\.md$/i.test(p));
        showFile(readme || [...files.keys()][0]);
      }
      e.target.value = '';
    });

    ['dragenter', 'dragover'].forEach((ev) =>
      contentEl.addEventListener(ev, (e) => { e.preventDefault(); emptyEl.classList.add('drag'); })
    );
    ['dragleave', 'drop'].forEach((ev) =>
      contentEl.addEventListener(ev, () => emptyEl.classList.remove('drag'))
    );
    contentEl.addEventListener('drop', async (e) => {
      e.preventDefault();
      const dt = e.dataTransfer;
      const items = dt.items;
      const collected = [];
      const walk = async (entry, prefix = '') => {
        if (entry.isFile) {
          const f = await new Promise((res) => entry.file(res));
          Object.defineProperty(f, 'webkitRelativePath', { value: prefix + f.name });
          collected.push(f);
        } else if (entry.isDirectory) {
          if (SKIP_DIRS.has(entry.name) || entry.name.startsWith('.')) return;
          const reader = entry.createReader();
          const entries = await new Promise((res) => reader.readEntries(res));
          for (const en of entries) await walk(en, prefix + entry.name + '/');
        }
      };
      const entries = [];
      for (const item of items) {
        const en = item.webkitGetAsEntry?.();
        if (en) entries.push(en);
      }
      if (entries.length) {
        for (const en of entries) await walk(en);
        await loadFiles(collected);
      } else {
        await loadFiles(dt.files);
      }
      renderTree();
      if (!current && files.size) {
        const readme = [...files.keys()].find((p) => /readme\.md$/i.test(p));
        showFile(readme || [...files.keys()][0]);
      }
    });

    searchEl.addEventListener('input', () => {
      searchQuery = searchEl.value;
      renderTree();
    });

    /* ---- theme ---- */
    const savedTheme = localStorage.getItem('md-theme');
    if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    const syncHljs = () => {
      const dark = document.documentElement.dataset.theme !== 'light';
      $('hljs-dark').disabled = !dark;
      $('hljs-light').disabled = dark;
      document.querySelector('meta[name="theme-color"]')
        .setAttribute('content', dark ? '#0d1117' : '#ffffff');
    };
    syncHljs();
    $('themeBtn').onclick = () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('md-theme', next);
      syncHljs();
    };

    $('clearBtn').onclick = async () => {
      if (!confirm('Clear all saved files from this device?')) return;
      await idbClear('files');
      await idbClear('meta');
      files.clear();
      current = null;
      docEl.innerHTML = '';
      docEl.hidden = true;
      emptyEl.hidden = false;
      filenameEl.textContent = 'No file loaded';
      filenameEl.classList.add('empty');
      tocListEl.innerHTML = '';
      searchEl.value = ''; searchQuery = '';
      renderTree();
      history.replaceState(null, '', location.pathname);
    };

    /* ============================================================
       PWA install
       ============================================================ */
    let deferredPrompt = null;
    const installBtn = $('installBtn');
    const isStandalone = () =>
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isStandalone()) installBtn.style.display = '';
    });

    installBtn.onclick = async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      if (outcome === 'accepted') installBtn.style.display = 'none';
    };

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
      deferredPrompt = null;
    });

    if (isStandalone()) installBtn.style.display = 'none';

    /* ============================================================
       Boot
       ============================================================ */
    (async function boot() {
      try {
        const stored = await idbGetAll('files');
        for (const rec of stored) files.set(rec.path, { name: rec.path, content: rec.content });
      } catch {}

      renderTree();

      const fromHash = readHash();
      let lastFile = null;
      try { lastFile = await idbGet('meta', 'lastFile'); } catch {}

      if (fromHash && files.has(fromHash)) showFile(fromHash, { updateHash: false });
      else if (lastFile && files.has(lastFile)) showFile(lastFile, { updateHash: false });
      else if (files.size) {
        const readme = [...files.keys()].find((p) => /readme\.md$/i.test(p));
        showFile(readme || [...files.keys()][0]);
      }
    })();
  }
</script>
</body>
</html>
