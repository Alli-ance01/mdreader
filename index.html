<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d1117" />
<title>MD Reader</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
<link rel="stylesheet" id="hljs-light" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" disabled>
<link rel="stylesheet" id="hljs-dark" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>

<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-2: #1c2128;
    --surface-3: #262c36;
    --border: #30363d;
    --border-soft: #21262d;
    --fg: #e6edf3;
    --fg-muted: #8b949e;
    --fg-dim: #6e7681;
    --accent: #58a6ff;
    --accent-2: #1f6feb;
    --accent-soft: rgba(88,166,255,0.12);
    --code-bg: #161b22;
    --sel: #264f78;
    --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  [data-theme="light"] {
    --bg: #ffffff;
    --surface: #f6f8fa;
    --surface-2: #eef1f4;
    --surface-3: #e4e8ec;
    --border: #d0d7de;
    --border-soft: #e4e8ec;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-dim: #8c959f;
    --accent: #0969da;
    --accent-2: #0969da;
    --accent-soft: rgba(9,105,218,0.1);
    --code-bg: #f6f8fa;
    --sel: #b6d7ff;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; overflow-x: clip; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.65 var(--font-ui);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--sel); color: var(--fg); }

  .app { display: grid; grid-template-columns: 280px minmax(0, 1fr); height: 100dvh; }
  body.toc-open.wide .app { grid-template-columns: 280px minmax(0, 1fr) 260px; }

  aside.side {
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden; min-width: 0;
  }
  aside.toc {
    background: var(--surface); border-left: 1px solid var(--border);
    overflow-y: auto; overflow-x: hidden;
    padding: 14px 8px; display: none; min-width: 0;
  }
  body.toc-open.wide aside.toc { display: block; }

  @media (max-width: 1100px) {
    .app { grid-template-columns: minmax(0, 1fr) !important; }
    aside.side {
      position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 40;
      transform: translateX(-100%); transition: transform .2s ease;
      box-shadow: 4px 0 24px rgba(0,0,0,.4);
    }
    aside.side.open { transform: none; }
    aside.toc {
      position: fixed; inset: 0 0 0 auto; width: 280px; z-index: 40;
      transform: translateX(100%); transition: transform .2s ease;
      display: block; box-shadow: -4px 0 24px rgba(0,0,0,.4);
    }
    aside.toc.open { transform: none; }
    #openFolder { display: none !important; }
  }

  /* Sidebar chrome */
  .side-head {
    padding: 14px 14px 12px;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--border-soft);
  }
  .brand { font-weight: 700; letter-spacing: -.02em; flex: 1; font-size: 15px; color: var(--fg); }
  .brand span { color: var(--fg-muted); font-weight: 500; }

  .icon-btn {
    width: 32px; height: 32px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--fg-muted);
    border: 1px solid transparent; border-radius: 6px;
    cursor: pointer; transition: background .12s, color .12s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--fg); }
  .icon-btn:active { background: var(--surface-3); }
  .icon-btn svg { width: 16px; height: 16px; }

  .search-wrap { padding: 10px 12px; position: relative; }
  .search-wrap svg {
    position: absolute; left: 22px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; color: var(--fg-dim); pointer-events: none;
  }
  .search {
    width: 100%; padding: 8px 10px 8px 32px;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; outline: none;
    transition: border-color .12s, box-shadow .12s;
    -webkit-appearance: none; appearance: none;
  }
  .search::placeholder { color: var(--fg-dim); }
  .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .tree {
    overflow-y: auto; overflow-x: hidden;
    padding: 6px 8px 8px; flex: 1; min-width: 0;
  }
  .tree::-webkit-scrollbar { width: 8px; }
  .tree::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ---- tree: folder rows ---- */
  .tree .folder-row {
    position: relative;
    display: flex; align-items: center; gap: 4px;
    width: 100%; text-align: left;
    background: none; border: 0;
    color: var(--fg-muted);
    padding: 5px 8px; border-radius: 5px;
    cursor: pointer; font: inherit; font-size: 13px; font-weight: 500;
    white-space: nowrap; overflow: hidden;
    transition: background .1s, color .1s;
  }
  .tree .folder-row:hover { background: var(--surface-2); color: var(--fg); }
  .tree .folder-row:active { background: var(--surface-3); }
  .tree .folder-row .chev {
    width: 12px; height: 12px; flex-shrink: 0;
    transition: transform .15s ease;
    color: var(--fg-dim);
  }
  .tree .folder-row.expanded .chev { transform: rotate(90deg); }
  .tree .folder-row .folder-icon {
    width: 14px; height: 14px; flex-shrink: 0; opacity: .7;
    transition: opacity .12s, color .12s;
  }
  .tree .folder-row.expanded .folder-icon { color: var(--accent); opacity: 1; }
  .tree .folder-row .folder-name {
    overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1;
    padding-left: 3px;
  }
  .tree .folder-row .folder-count {
    font-size: 10.5px; font-weight: 600;
    color: var(--fg-dim);
    padding: 1px 6px; min-width: 18px; text-align: center;
    background: var(--surface-2);
    border-radius: 10px;
    flex-shrink: 0;
  }
  .tree .folder-row:hover .folder-count,
  .tree .folder-row.expanded .folder-count { background: var(--surface-3); color: var(--fg-muted); }

  /* ---- tree: file rows ---- */
  .tree .file {
    position: relative;
    display: flex; align-items: center; gap: 8px;
    width: 100%; text-align: left;
    background: none; border: 0;
    color: var(--fg-muted);
    padding: 5px 8px; border-radius: 5px;
    cursor: pointer; font: inherit; font-size: 13px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background .1s, color .1s;
  }
  .tree .file svg { width: 14px; height: 14px; flex-shrink: 0; opacity: .7; }
  .tree .file:hover { background: var(--surface-2); color: var(--fg); }
  .tree .file:hover svg { opacity: 1; }
  .tree .file:active { background: var(--surface-3); }
  .tree .file.active {
    background: var(--accent-soft); color: var(--fg); font-weight: 600;
  }
  .tree .file.active svg { opacity: 1; }
  .tree .file.active::before {
    content: ""; position: absolute;
    left: 0; top: 6px; bottom: 6px; width: 2px;
    background: var(--accent); border-radius: 0 2px 2px 0;
  }
  .tree .file-name { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .tree .file-name .ext { color: var(--fg-dim); font-weight: 400; }

  /* type-based icon colors */
  .tree .file[data-type="md"] svg      { color: #58a6ff; }
  .tree .file[data-type="mmd"] svg     { color: #d2a8ff; }
  .tree .file[data-type="csv"] svg     { color: #3fb950; }
  .tree .file[data-type="xlsx"] svg    { color: #f0883e; }
  [data-theme="light"] .tree .file[data-type="md"] svg   { color: #0969da; }
  [data-theme="light"] .tree .file[data-type="mmd"] svg  { color: #8250df; }
  [data-theme="light"] .tree .file[data-type="csv"] svg  { color: #1a7f37; }
  [data-theme="light"] .tree .file[data-type="xlsx"] svg { color: #bc4c00; }

  .tree .empty-tree {
    padding: 20px 12px; text-align: center;
    font-size: 13px; color: var(--fg-dim);
  }

  .side-foot {
    padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    border-top: 1px solid var(--border-soft);
  }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--surface-2); color: var(--fg);
    border: 1px solid var(--border);
    padding: 7px 12px; border-radius: 6px;
    font: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
    transition: background .12s, border-color .12s;
  }
  .btn:hover { background: var(--surface-3); }
  .btn:active { background: var(--surface-3); transform: translateY(1px); }
  .btn svg { width: 14px; height: 14px; flex-shrink: 0; }
  .btn.primary { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
  .btn.primary:hover { background: #2d7ff0; border-color: #2d7ff0; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--fg-muted); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--fg); }

  main { display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

  header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    padding-top: max(10px, env(safe-area-inset-top));
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
    min-width: 0;
  }
  header .btn, header .icon-btn { flex-shrink: 0; }

  .filename {
    flex: 1; min-width: 0;
    font-size: 12.5px; font-weight: 500;
    color: var(--fg-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: var(--font-mono);
    padding: 0 4px;
  }
  .filename.empty { color: var(--fg-dim); font-family: var(--font-ui); font-weight: 400; }

  .hamburger { display: none; }
  @media (max-width: 1100px) {
    .hamburger { display: inline-flex; }
    header { gap: 6px; padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top)); }
    .btn { padding: 7px 10px; font-size: 12.5px; }
    .btn .label { display: none; }
    .btn.has-icon { padding: 7px 9px; }
  }

  .content {
    overflow: auto; scroll-behavior: smooth; min-width: 0;
    padding: 32px 28px 100px;
  }
  .content::-webkit-scrollbar { width: 10px; height: 10px; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  .content::-webkit-scrollbar-thumb:hover { background: var(--surface-3); }

  .doc {
    max-width: 780px; margin: 0 auto;
    min-width: 0; overflow-wrap: anywhere;
    user-select: text; -webkit-user-select: text;
  }
  .doc.wide { max-width: 1100px; } /* for CSV/XLSX */

  @media (max-width: 1100px) { .content { padding: 20px 16px 80px; } }

  /* Empty state */
  .empty {
    max-width: 440px; margin: 8vh auto 0;
    text-align: center; color: var(--fg-muted); padding: 40px 24px;
  }
  .empty-glyph {
    width: 56px; height: 56px; margin: 0 auto 18px;
    border-radius: 14px; background: var(--accent-2);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 20px;
    font-family: var(--font-mono); letter-spacing: -.05em;
  }
  .empty h2 { color: var(--fg); margin: 0 0 8px; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
  .empty p { margin: 0 0 22px; font-size: 14px; line-height: 1.6; color: var(--fg-muted); }
  .empty-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .empty.drag {
    background: var(--accent-soft); border-radius: 12px;
    outline: 2px dashed var(--accent); outline-offset: 8px;
  }

  /* Markdown typography */
  .doc h1, .doc h2, .doc h3, .doc h4 {
    line-height: 1.25; font-weight: 700; letter-spacing: -.02em;
    margin: 2em 0 .65em; color: var(--fg); scroll-margin-top: 70px;
  }
  .doc > h1:first-child, .doc > h2:first-child, .doc > h3:first-child { margin-top: 0; }
  .doc h1 { font-size: 2em; padding-bottom: .35em; border-bottom: 1px solid var(--border); }
  .doc h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border-soft); }
  .doc h3 { font-size: 1.2em; }
  .doc h4 { font-size: 1em; color: var(--fg-muted); }
  .doc p, .doc ul, .doc ol, .doc blockquote, .doc table, .doc pre { margin: 0 0 1em; }
  .doc a { color: var(--accent); text-decoration: none; }
  .doc a:hover { text-decoration: underline; }
  .doc ul, .doc ol { padding-left: 1.6em; }
  .doc li + li { margin-top: .25em; }
  .doc li > p { margin: 0 0 .5em; }
  .doc blockquote {
    border-left: 3px solid var(--border);
    color: var(--fg-muted); padding: 2px 0 2px 1em;
    margin-left: 0; margin-right: 0;
  }
  .doc code {
    background: var(--code-bg); padding: .18em .42em;
    border-radius: 5px; border: 1px solid var(--border-soft);
    font: 85%/1.5 var(--font-mono);
  }
  .doc pre {
    background: var(--code-bg); padding: 14px 16px; border-radius: 8px;
    overflow: auto; border: 1px solid var(--border); max-width: 100%;
  }
  .doc pre code { background: none; padding: 0; border: 0; font-size: 13px; line-height: 1.6; }

  .doc table {
    border-collapse: collapse;
    display: block; overflow: auto; max-width: 100%;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 13.5px;
  }
  .doc th, .doc td {
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    padding: 7px 12px;
    max-width: 380px;
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .doc th:last-child, .doc td:last-child { border-right: 0; }
  .doc tr:last-child td { border-bottom: 0; }
  .doc th {
    background: var(--surface-2); font-weight: 600;
    text-align: left; color: var(--fg);
    position: sticky; top: 0; z-index: 1;
  }
  .doc tbody tr:hover { background: var(--surface-2); }

  .doc img, .doc video, .doc svg { max-width: 100%; height: auto; border-radius: 8px; }
  .doc hr { border: 0; border-top: 1px solid var(--border); margin: 2.5em 0; }
  .doc input[type="checkbox"] {
    margin-right: .5em; accent-color: var(--accent-2); transform: translateY(1px);
  }
  .doc .task-list-item { list-style: none; margin-left: -1.5em; }

  .doc .katex-display { overflow-x: auto; overflow-y: hidden; padding: 8px 0; max-width: 100%; }
  .doc .katex { font-size: 1.05em; }

  /* Sheet tabs (XLSX) */
  .doc .sheet-tabs {
    display: flex; gap: 2px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px; overflow-x: auto;
  }
  .doc .sheet-tabs::-webkit-scrollbar { height: 4px; }
  .doc .sheet-tab {
    background: none; border: 0;
    border-bottom: 2px solid transparent;
    color: var(--fg-muted);
    padding: 8px 14px; cursor: pointer; font: inherit;
    font-size: 13px; font-weight: 500; white-space: nowrap;
    transition: color .12s, border-color .12s;
    margin-bottom: -1px;
  }
  .doc .sheet-tab:hover { color: var(--fg); }
  .doc .sheet-tab.active { color: var(--fg); border-bottom-color: var(--accent); }

  /* Mermaid */
  .doc .mermaid {
    background: var(--surface); padding: 20px; border-radius: 8px;
    border: 1px solid var(--border); text-align: center;
    overflow-x: auto;
  }
  .doc .mermaid svg { max-width: 100%; height: auto; }

  /* TOC */
  .toc-title {
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--fg-dim); padding: 4px 12px 10px;
  }
  .toc-list { display: flex; flex-direction: column; gap: 1px; }
  .toc a {
    position: relative; display: block;
    padding: 6px 12px; border-radius: 6px;
    color: var(--fg-muted); text-decoration: none;
    font-size: 12.5px; line-height: 1.4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background .1s, color .1s;
  }
  .toc a:hover { background: var(--surface-2); color: var(--fg); }
  .toc a.lvl-1 { color: var(--fg); font-weight: 600; }
  .toc a.lvl-2 { padding-left: 12px; }
  .toc a.lvl-3 { padding-left: 24px; font-size: 12px; }
  .toc a.lvl-4 { padding-left: 36px; font-size: 12px; color: var(--fg-dim); }
  .toc a.active { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
  .toc a.active::before {
    content: ""; position: absolute;
    left: 0; top: 6px; bottom: 6px; width: 2px;
    background: var(--accent); border-radius: 0 2px 2px 0;
  }
  .toc-empty { padding: 12px; text-align: center; font-size: 12px; color: var(--fg-dim); }

  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    z-index: 35; display: none;
  }
  .scrim.show { display: block; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>

<div class="app">
  <aside class="side" id="sidebar">
    <div class="side-head">
      <div class="brand">MD <span>Reader</span></div>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </button>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input type="search" class="search" id="search" placeholder="Search files…" autocomplete="off" />
    </div>

    <div class="tree" id="tree"></div>

    <div class="side-foot">
      <button class="btn ghost" id="clearBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/>
        </svg>
        <span>Clear</span>
      </button>
      <button class="btn ghost" id="openFolderSide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        </svg>
        <span>Folder</span>
      </button>
    </div>
  </aside>

  <main>
    <header>
      <button class="icon-btn hamburger" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <button class="btn primary has-icon" id="openFiles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
        </svg>
        <span class="label">Open files</span>
      </button>
      <button class="btn has-icon" id="openFolder" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        </svg>
        <span class="label">Open folder</span>
      </button>
      <div class="filename empty" id="filename">No file loaded</div>
      <button class="btn primary has-icon" id="installBtn" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>
        </svg>
        <span class="label">Install</span>
      </button>
      <button class="icon-btn" id="tocBtn" aria-label="Outline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h12M4 18h8"/>
        </svg>
      </button>
    </header>

    <div class="content" id="content">
      <div class="empty" id="empty">
        <div class="empty-glyph">MD</div>
        <h2>No files yet</h2>
        <p>Drop files or open your project folder. Supports Markdown, Mermaid diagrams, CSV, and Excel.</p>
        <div class="empty-actions">
          <button class="btn primary" id="emptyOpenFiles">Open files</button>
          <button class="btn" id="emptyOpenFolder">Open folder</button>
        </div>
      </div>
      <div class="doc" id="doc" hidden></div>
    </div>
  </main>

  <aside class="toc" id="toc">
    <div class="toc-title">On this page</div>
    <div class="toc-list" id="tocList"></div>
  </aside>
</div>

<div class="scrim" id="scrim"></div>

<input type="file" id="fileInput" multiple accept=".md,.markdown,.mdx,.txt,.mmd,.csv,.tsv,.xlsx,.xls" hidden />
<input type="file" id="folderInput" webkitdirectory multiple hidden />

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }

  window.addEventListener('load', init);

  /* ============================================================
     IndexedDB wrapper
     ============================================================ */
  const DB = 'md-reader', DBV = 1;
  function idb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB, DBV);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'path' });
        if (!db.objectStoreNames.contains('meta'))  db.createObjectStore('meta');
      };
      r.onsuccess = () => res(r.result);
      r.onerror   = () => rej(r.error);
    });
  }
  const idbTx = async (store, mode, fn) => {
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, mode);
      const req = fn(tx.objectStore(store));
      tx.oncomplete = () => res(req && req.result);
      tx.onerror = () => rej(tx.error);
    });
  };
  const idbPut    = (s, v, k) => idbTx(s, 'readwrite', (os) => k === undefined ? os.put(v) : os.put(v, k));
  const idbGet    = (s, k)    => idbTx(s, 'readonly',  (os) => os.get(k));
  const idbGetAll = (s)       => idbTx(s, 'readonly',  (os) => os.getAll());
  const idbClear  = (s)       => idbTx(s, 'readwrite', (os) => os.clear());

  /* ============================================================
     Lazy loaders
     ============================================================ */
  const loadScript = (src) => new Promise((res) => {
    if (document.querySelector(`script[src="${src}"]`)) return res(true);
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => res(true);
    s.onerror = () => res(false);
    document.head.appendChild(s);
  });

  let _mermaidPromise = null;
  function ensureMermaid() {
    if (window.mermaid) return Promise.resolve(true);
    if (!_mermaidPromise) {
      _mermaidPromise = loadScript('https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js')
        .then((ok) => {
          if (ok && window.mermaid) {
            const dark = document.documentElement.dataset.theme !== 'light';
            window.mermaid.initialize({
              startOnLoad: false,
              theme: dark ? 'dark' : 'default',
              securityLevel: 'loose',
              fontFamily: 'Inter, sans-serif',
            });
          }
          return ok;
        });
    }
    return _mermaidPromise;
  }

  let _xlsxPromise = null;
  function ensureXLSX() {
    if (window.XLSX) return Promise.resolve(true);
    if (!_xlsxPromise) {
      _xlsxPromise = loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
    }
    return _xlsxPromise;
  }

  /* ============================================================
     Init
     ============================================================ */
  function init() {
    const md = window.markdownit({ html: true, linkify: true, typographer: true, breaks: false,
      highlight(str, lang) {
        if (lang && window.hljs && hljs.getLanguage(lang)) {
          try { return hljs.highlight(str, { language: lang }).value; } catch {}
        }
        return '';
      },
    });

    // GFM task lists
    md.core.ruler.after('inline', 'gfm-task-list', (state) => {
      const t = state.tokens;
      for (let i = 2; i < t.length; i++) {
        if (t[i].type !== 'inline' || t[i-2].type !== 'list_item_open') continue;
        const first = t[i].children[0];
        if (first && first.type === 'text') {
          const m = first.content.match(/^\[([ xX])\]\s+/);
          if (m) {
            first.content = first.content.slice(m[0].length);
            const box = new state.Token('html_inline', '', 0);
            box.content = `<input type="checkbox" disabled ${m[1].toLowerCase()==='x'?'checked':''}>`;
            t[i].children.unshift(box);
            t[i-2].attrJoin('class', 'task-list-item');
          }
        }
      }
    });

    // KaTeX
    const esc = md.utils.escapeHtml;
    const renderMath = (src, displayMode) => {
      if (!window.katex) return esc(src);
      try { return katex.renderToString(src, { displayMode, throwOnError: false, output: 'html' }); }
      catch { return esc(src); }
    };
    md.inline.ruler.after('escape', 'math_inline', (state, silent) => {
      const s = state.pos;
      if (state.src[s] !== '$' || state.src[s+1] === '$') return false;
      let p = s + 1;
      while (p < state.posMax) {
        const c = state.src[p];
        if (c === '\\') { p += 2; continue; }
        if (c === '\n') return false;
        if (c === '$') break;
        p++;
      }
      if (p >= state.posMax || state.src[p] !== '$') return false;
      const content = state.src.slice(s+1, p);
      if (!content.trim()) return false;
      if (!silent) { const tk = state.push('math_inline', 'math', 0); tk.content = content; }
      state.pos = p + 1;
      return true;
    });
    md.renderer.rules.math_inline = (t, i) => renderMath(t[i].content, false);

    md.block.ruler.before('fence', 'math_block', (state, startLine, endLine, silent) => {
      const pos = state.bMarks[startLine] + state.tShift[startLine];
      const max = state.eMarks[startLine];
      if (pos + 2 > max || state.src.slice(pos, pos+2) !== '$$') return false;
      const firstLine = state.src.slice(pos + 2, max);
      if (firstLine.trim().endsWith('$$') && firstLine.trim().length > 2) {
        if (silent) return true;
        const tk = state.push('math_block', 'math', 0);
        tk.content = firstLine.trim().slice(0, -2);
        tk.block = true;
        state.line = startLine + 1;
        return true;
      }
      let found = false, lastLine = 0, lastPos = 0;
      for (let n = startLine + 1; n < endLine; n++) {
        const p = state.bMarks[n] + state.tShift[n];
        const m = state.eMarks[n];
        const idx = state.src.slice(p, m).indexOf('$$');
        if (idx >= 0) { lastLine = n; lastPos = p + idx; found = true; break; }
      }
      if (!found) return false;
      if (silent) return true;
      const tk = state.push('math_block', 'math', 0);
      tk.content = state.src.slice(pos + 2, lastPos);
      tk.block = true;
      state.line = lastLine + 1;
      return true;
    });
    md.renderer.rules.math_block = (t, i) => '<p>' + renderMath(t[i].content, true) + '</p>\n';

    /* ============================================================
       State
       ============================================================ */
    const files = new Map();
    let current = null;
    let searchQuery = '';
    let expandedFolders = new Set();
    try {
      expandedFolders = new Set(JSON.parse(localStorage.getItem('md-expanded') || '[]'));
    } catch {}

    const $ = (id) => document.getElementById(id);
    const docEl = $('doc'), emptyEl = $('empty'), filenameEl = $('filename');
    const treeEl = $('tree'), contentEl = $('content');
    const sidebar = $('sidebar'), tocEl = $('toc'), tocListEl = $('tocList');
    const scrim = $('scrim'), searchEl = $('search');

    const mq = window.matchMedia('(max-width: 1100px)');
    const isNarrow = () => mq.matches;
    const applyWide = () => {
      document.body.classList.toggle('wide', !isNarrow());
      if (isNarrow()) closeDrawers();
    };
    mq.addEventListener('change', applyWide);
    applyWide();

    function closeDrawers() {
      sidebar.classList.remove('open');
      tocEl.classList.remove('open');
      scrim.classList.remove('show');
    }
    function openSide() {
      sidebar.classList.add('open');
      tocEl.classList.remove('open');
      scrim.classList.add('show');
    }
    function openTocDrawer() {
      tocEl.classList.add('open');
      sidebar.classList.remove('open');
      scrim.classList.add('show');
    }
    scrim.onclick = closeDrawers;

    function saveExpanded() {
      try { localStorage.setItem('md-expanded', JSON.stringify([...expandedFolders])); } catch {}
    }

    /* ============================================================
       File type detection
       ============================================================ */
    function detectType(path) {
      if (/\.(md|markdown|mdx|txt)$/i.test(path)) return 'md';
      if (/\.mmd$/i.test(path)) return 'mmd';
      if (/\.(csv|tsv)$/i.test(path)) return 'csv';
      if (/\.(xlsx|xls)$/i.test(path)) return 'xlsx';
      return null;
    }
    const isSupported = (path) => !!detectType(path);

    /* ============================================================
       File loading
       ============================================================ */
    async function loadFiles(list) {
      const jobs = [];
      const added = [];

      for (const f of list) {
        const path = (f.webkitRelativePath || f.name).replace(/^\/+/, '');
        const type = detectType(path);
        if (!type) continue;

        jobs.push((async () => {
          try {
            if (type === 'xlsx') {
              await ensureXLSX();
              if (!window.XLSX) return;
              const buf = await f.arrayBuffer();
              const wb = XLSX.read(buf, { type: 'array' });
              const sheets = wb.SheetNames.map((name) => ({
                name,
                rows: XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '', raw: false }),
              }));
              const entry = { name: path, type, data: { sheets } };
              files.set(path, entry);
              added.push({ path, type, data: entry.data, savedAt: Date.now() });
            } else {
              const content = await f.text();
              const entry = { name: path, type, content };
              files.set(path, entry);
              added.push({ path, type, content, savedAt: Date.now() });
            }
          } catch (e) {
            console.warn('Failed to load', path, e);
          }
        })());
      }

      await Promise.all(jobs);
      for (const rec of added) idbPut('files', rec).catch(() => {});
      return added.length;
    }

    const SKIP_DIRS = new Set(['node_modules', '.git', '.next', 'dist', 'build', 'out', '.cache', 'coverage', 'vendor', '.venv', 'venv', '__pycache__', '.idea', '.vscode']);

    async function walkHandle(dirHandle, prefix, out, depth = 0) {
      if (depth > 8) return;
      for await (const [name, handle] of dirHandle.entries()) {
        if (handle.kind === 'file') {
          if (isSupported(name)) out.push({ handle, path: prefix + name });
        } else if (handle.kind === 'directory') {
          if (SKIP_DIRS.has(name) || name.startsWith('.')) continue;
          await walkHandle(handle, prefix + name + '/', out, depth + 1);
        }
      }
    }

    async function pickFolderFS() {
      if (!window.showDirectoryPicker) return false;
      try {
        const dirHandle = await window.showDirectoryPicker({ mode: 'read' });
        const entries = [];
        await walkHandle(dirHandle, '', entries);
        if (!entries.length) return true;

        const collected = [];
        for (const { handle, path } of entries) {
          try {
            const f = await handle.getFile();
            Object.defineProperty(f, 'webkitRelativePath', { value: path, configurable: true });
            collected.push(f);
          } catch {}
        }
        await loadFiles(collected);
        renderTree();
        if (!current && files.size) {
          const readme = [...files.keys()].find((p) => /readme\.md$/i.test(p));
          showFile(readme || [...files.keys()][0]);
        }
        return true;
      } catch (e) {
        if (e && e.name === 'AbortError') return true;
        return false;
      }
    }

    /* ============================================================
       Tree building & rendering
       ============================================================ */
    function buildTree(paths) {
      const root = { name: '', path: '', folders: new Map(), files: [], count: 0 };
      for (const p of paths) {
        const parts = p.split('/');
        let node = root;
        let acc = '';
        for (let i = 0; i < parts.length - 1; i++) {
          acc = acc ? acc + '/' + parts[i] : parts[i];
          if (!node.folders.has(parts[i])) {
            node.folders.set(parts[i], { name: parts[i], path: acc, folders: new Map(), files: [], count: 0 });
          }
          node = node.folders.get(parts[i]);
        }
        node.files.push({ name: parts[parts.length - 1], path: p, type: detectType(p) || 'md' });
      }
      computeCounts(root);
      return root;
    }
    function computeCounts(node) {
      let n = node.files.length;
      for (const sub of node.folders.values()) n += computeCounts(sub);
      node.count = n;
      return n;
    }

    const TREE_ICONS = {
      md: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>`,
      mmd: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><path d="M10 6.5h4a2 2 0 0 1 2 2v5.5"/></svg>`,
      csv: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>`,
      xlsx: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/><path d="M9 9l6 6M15 9l-6 6"/></svg>`,
    };

    const FOLDER_ICON = `<svg class="folder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`;
    const CHEVRON = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>`;

    function renderTree() {
      treeEl.innerHTML = '';
      const q = searchQuery.trim().toLowerCase();
      const allPaths = [...files.keys()].sort();
      const paths = q ? allPaths.filter((p) => p.toLowerCase().includes(q)) : allPaths;

      if (!paths.length) {
        const div = document.createElement('div');
        div.className = 'empty-tree';
        div.textContent = q ? 'No matches' : 'No files loaded yet';
        treeEl.appendChild(div);
        return;
      }

      const root = buildTree(paths);
      renderNode(root, 0, !!q);
    }

    function renderNode(node, depth, forceExpand) {
      const folders = [...node.folders.values()].sort((a, b) => a.name.localeCompare(b.name));
      const nodeFiles = [...node.files].sort((a, b) => a.name.localeCompare(b.name));

      for (const folder of folders) {
        const expanded = forceExpand || expandedFolders.has(folder.path);
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'folder-row' + (expanded ? ' expanded' : '');
        row.style.paddingLeft = (8 + depth * 14) + 'px';
        row.title = folder.path;
        row.innerHTML = CHEVRON + FOLDER_ICON +
          `<span class="folder-name">${escapeHtml(folder.name)}</span>` +
          `<span class="folder-count">${folder.count}</span>`;
        row.onclick = () => {
          if (expandedFolders.has(folder.path)) expandedFolders.delete(folder.path);
          else expandedFolders.add(folder.path);
          saveExpanded();
          renderTree();
        };
        treeEl.appendChild(row);

        if (expanded) renderNode(folder, depth + 1, forceExpand);
      }

      for (const f of nodeFiles) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'file' + (f.path === current ? ' active' : '');
        b.style.paddingLeft = (8 + (depth + 1) * 14) + 'px';
        b.dataset.path = f.path;
        b.dataset.type = f.type;
        b.title = f.path;

        const dot = f.name.lastIndexOf('.');
        const base = dot > 0 ? f.name.slice(0, dot) : f.name;
        const ext  = dot > 0 ? f.name.slice(dot) : '';
        b.innerHTML = (TREE_ICONS[f.type] || TREE_ICONS.md) +
          `<span class="file-name">${escapeHtml(base)}<span class="ext">${escapeHtml(ext)}</span></span>`;
        b.onclick = () => showFile(f.path);
        treeEl.appendChild(b);
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function expandAncestors(path) {
      const parts = path.split('/');
      let acc = '';
      for (let i = 0; i < parts.length - 1; i++) {
        acc = acc ? acc + '/' + parts[i] : parts[i];
        expandedFolders.add(acc);
      }
      saveExpanded();
    }

    /* ============================================================
       Routing
       ============================================================ */
    function readHash() {
      const h = location.hash;
      if (!h.startsWith('#/')) return null;
      try { return decodeURI(h.slice(2)); } catch { return null; }
    }
    function setHash(path, replace = false) {
      const next = '#/' + encodeURI(path);
      if (location.hash === next) return;
      if (replace) history.replaceState(null, '', next);
      else location.hash = next;
    }
    window.addEventListener('hashchange', () => {
      const p = readHash();
      if (p && files.has(p) && p !== current) showFile(p, { updateHash: false });
    });

    /* ============================================================
       TOC (only for markdown)
       ============================================================ */
    function headingText(h) {
      const clone = h.cloneNode(true);
      clone.querySelectorAll('.katex-mathml').forEach((n) => n.remove());
      return clone.textContent.trim();
    }
    function slugify(s) {
      return s.toLowerCase().trim()
        .replace(/[^\w\s-]/g, '').replace(/\s+/g, '-')
        .replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 80) || 'section';
    }

    function buildTOC() {
      const hs = docEl.querySelectorAll('h1, h2, h3, h4');
      const used = new Map();
      const toc = [];
      hs.forEach((h) => {
        const level = +h.tagName[1];
        let slug = slugify(headingText(h));
        if (used.has(slug)) {
          const n = used.get(slug) + 1;
          used.set(slug, n);
          slug = `${slug}-${n}`;
        } else used.set(slug, 0);
        h.id = slug;
        toc.push({ level, text: headingText(h), id: slug });
      });

      tocListEl.innerHTML = '';
      if (!toc.length) {
        const d = document.createElement('div');
        d.className = 'toc-empty';
        d.textContent = 'No headings';
        tocListEl.appendChild(d);
        return toc;
      }
      for (const item of toc) {
        const a = document.createElement('a');
        a.href = '#' + item.id;
        a.className = 'lvl-' + item.level;
        a.textContent = item.text;
        a.dataset.id = item.id;
        a.onclick = (e) => {
          e.preventDefault();
          const el = document.getElementById(item.id);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          if (isNarrow()) closeDrawers();
        };
        tocListEl.appendChild(a);
      }
      return toc;
    }

    let scrollSpy = null;
    function setupScrollSpy() {
      if (scrollSpy) scrollSpy.disconnect();
      const headings = docEl.querySelectorAll('h1, h2, h3, h4');
      if (!headings.length) return;
      const map = new Map();
      tocListEl.querySelectorAll('a').forEach((a) => map.set(a.dataset.id, a));
      scrollSpy = new IntersectionObserver((entries) => {
        entries.forEach((en) => {
          const a = map.get(en.target.id);
          if (!a) return;
          if (en.isIntersecting) {
            tocListEl.querySelectorAll('a.active').forEach((x) => x.classList.remove('active'));
            a.classList.add('active');
          }
        });
      }, { root: contentEl, rootMargin: '-70px 0px -70% 0px', threshold: 0 });
      headings.forEach((h) => scrollSpy.observe(h));
    }

    /* ============================================================
       Renderers
       ============================================================ */
    function parseCSV(text, delim) {
      const rows = [];
      let row = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"') {
            if (text[i+1] === '"') { cur += '"'; i++; }
            else inQuotes = false;
          } else cur += c;
        } else {
          if (c === '"') inQuotes = true;
          else if (c === delim) { row.push(cur); cur = ''; }
          else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
          else if (c === '\r') { /* skip */ }
          else cur += c;
        }
      }
      if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
      return rows;
    }

    function rowsToTable(rows, headerRow = true) {
      if (!rows.length) return '<p>Empty</p>';
      const head = headerRow ? rows[0] : null;
      const body = headerRow ? rows.slice(1) : rows;
      const cols = Math.max(head ? head.length : 0, ...rows.map((r) => r.length));
      let html = '<table>';
      if (head) {
        html += '<thead><tr>';
        for (let i = 0; i < cols; i++) html += `<th>${escapeHtml(head[i] ?? '')}</th>`;
        html += '</tr></thead>';
      }
      html += '<tbody>';
      for (const r of body) {
        html += '<tr>';
        for (let i = 0; i < cols; i++) html += `<td>${escapeHtml(r[i] ?? '')}</td>`;
        html += '</tr>';
      }
      html += '</tbody></table>';
      return html;
    }

    function renderCSV(text, path) {
      const delim = /\.tsv$/i.test(path) ? '\t' : ',';
      const rows = parseCSV(text, delim);
      if (!rows.length) return '<p>Empty file.</p>';
      return rowsToTable(rows, true);
    }

    function renderXLSX(data) {
      if (!data || !data.sheets || !data.sheets.length) return '<p>Empty workbook.</p>';
      let html = '<div class="sheet-tabs" role="tablist">';
      data.sheets.forEach((s, i) => {
        html += `<button class="sheet-tab${i === 0 ? ' active' : ''}" data-sheet="${i}" role="tab">${escapeHtml(s.name)}</button>`;
      });
      html += '</div>';
      data.sheets.forEach((s, i) => {
        html += `<div class="sheet-body" data-sheet="${i}"${i !== 0 ? ' hidden' : ''}>`;
        html += rowsToTable(s.rows || [], true);
        html += '</div>';
      });
      return html;
    }

    async function renderMermaid(code) {
      docEl.innerHTML = '<div class="mermaid">' + escapeHtml(code) + '</div>';
      const ok = await ensureMermaid();
      if (!ok) {
        docEl.innerHTML = '<pre><code>' + escapeHtml(code) + '</code></pre>';
        return;
      }
      try {
        const dark = document.documentElement.dataset.theme !== 'light';
        mermaid.initialize({
          startOnLoad: false,
          theme: dark ? 'dark' : 'default',
          securityLevel: 'loose',
          fontFamily: 'Inter, sans-serif',
        });
        await mermaid.run({ querySelector: '.mermaid' });
      } catch (e) {
        docEl.innerHTML = '<pre><code>' + escapeHtml(code) + '</code></pre>';
      }
    }

    /* ============================================================
       Show file
       ============================================================ */
    async function showFile(path, { updateHash = true } = {}) {
      const f = files.get(path);
      if (!f) return;
      current = path;
      filenameEl.textContent = path;
      filenameEl.classList.remove('empty');
      contentEl.scrollTop = 0;
      docEl.classList.toggle('wide', f.type === 'csv' || f.type === 'xlsx');

      // expand ancestors, then re-render tree
      expandAncestors(path);
      renderTree();
      if (isNarrow()) closeDrawers();
      if (updateHash) setHash(path);
      idbPut('meta', path, 'lastFile').catch(() => {});

      const type = f.type || 'md';
      docEl.hidden = false;
      emptyEl.hidden = true;

      if (type === 'md') {
        docEl.innerHTML = md.render(f.content || '');
        buildTOC();
        setupScrollSpy();
        if (!isNarrow() && tocListEl.children.length) document.body.classList.add('toc-open');
      } else if (type === 'mmd') {
        tocListEl.innerHTML = '<div class="toc-empty">Diagram</div>';
        await renderMermaid(f.content || '');
      } else if (type === 'csv') {
        tocListEl.innerHTML = '<div class="toc-empty">Table</div>';
        docEl.innerHTML = renderCSV(f.content || '', path);
      } else if (type === 'xlsx') {
        tocListEl.innerHTML = '<div class="toc-empty">Workbook</div>';
        docEl.innerHTML = renderXLSX(f.data);
        docEl.querySelectorAll('.sheet-tab').forEach((tab) => {
          tab.onclick = () => {
            docEl.querySelectorAll('.sheet-tab').forEach((t) => t.classList.toggle('active', t === tab));
            docEl.querySelectorAll('.sheet-body').forEach((b) => {
              b.hidden = b.dataset.sheet !== tab.dataset.sheet;
            });
          };
        });
      }

      // internal .md link interception
      docEl.querySelectorAll('a[href]').forEach((a) => {
        const href = a.getAttribute('href');
        if (!href || /^(https?:|mailto:|#)/.test(href)) return;
        a.addEventListener('click', (e) => {
          const target = resolvePath(current, href.split('#')[0]);
          if (files.has(target)) { e.preventDefault(); showFile(target); }
          else a.title = `Not loaded: ${target}`;
        });
      });
    }

    function resolvePath(fromPath, rel) {
      if (!rel.startsWith('.')) return rel;
      const fromDir = fromPath.includes('/') ? fromPath.slice(0, fromPath.lastIndexOf('/')) : '';
      const parts = (fromDir + '/' + rel).split('/');
      const out = [];
      for (const p of parts) {
        if (p === '' || p === '.') continue;
        if (p === '..') out.pop(); else out.push(p);
      }
      return out.join('/');
    }

    /* ============================================================
       UI wiring
       ============================================================ */
    $('openFiles').onclick = () => $('fileInput').click();
    $('emptyOpenFiles').onclick = () => $('fileInput').click();

    const folderSupported = !!window.showDirectoryPicker || ('webkitdirectory' in document.createElement('input'));
    const folderBtn = $('openFolder');
    const folderBtnSide = $('openFolderSide');
    const emptyFolderBtn = $('emptyOpenFolder');

    if (folderSupported) {
      folderBtn.style.display = '';
      folderBtnSide.style.display = '';
      emptyFolderBtn.style.display = '';
    } else {
      folderBtn.style.display = 'none';
      folderBtnSide.style.display = 'none';
      emptyFolderBtn.style.display = 'none';
    }

    async function handleFolderClick() {
      if (window.showDirectoryPicker) {
        const ok = await pickFolderFS();
        if (ok) return;
      }
      if ('webkitdirectory' in document.createElement('input')) {
        $('folderInput').click();
      }
    }
    folderBtn.onclick = handleFolderClick;
    folderBtnSide.onclick = handleFolderClick;
    emptyFolderBtn.onclick = handleFolderClick;

    $('menuBtn').onclick = () => sidebar.classList.contains('open') ? closeDrawers() : openSide();

    $('tocBtn').onclick = () => {
      if (isNarrow()) {
        tocEl.classList.contains('open') ? closeDrawers() : openTocDrawer();
      } else {
        document.body.classList.toggle('toc-open');
      }
    };

    $('fileInput').addEventListener('change', async (e) => {
      await loadFiles(e.target.files);
      renderTree();
      if (!current && files.size) {
        const readme = [...files.keys()].find((p) => /readme\.md$/i.test(p));
        showFile(readme || [...files.keys()][0]);
      }
      e.target.value = '';
    });

    $('folderInput').addEventListener('change', async (e) => {
      await loadFiles(e.target.files);
      renderTree();
      if (!current && files.size) {
        const readme = [...files.keys()].find((p) => /readme\.md$/i.test(p));
        showFile(readme || [...files.keys()][0]);
      }
      e.target.value = '';
    });

    ['dragenter', 'dragover'].forEach((ev) =>
      contentEl.addEventListener(ev, (e) => { e.preventDefault(); emptyEl.classList.add('drag'); })
    );
    ['dragleave', 'drop'].forEach((ev) =>
      contentEl.addEventListener(ev, () => emptyEl.classList.remove('drag'))
    );
    contentEl.addEventListener('drop', async (e) => {
      e.preventDefault();
      const dt = e.dataTransfer;
      const items = dt.items;
      const collected = [];
      const walk = async (entry, prefix = '') => {
        if (entry.isFile) {
          const f = await new Promise((res) => entry.file(res));
          Object.defineProperty(f, 'webkitRelativePath', { value: prefix + f.name });
          collected.push(f);
        } else if (entry.isDirectory) {
          if (SKIP_DIRS.has(entry.name) || entry.name.startsWith('.')) return;
          const reader = entry.createReader();
          const entries = await new Promise((res) => reader.readEntries(res));
          for (const en of entries) await walk(en, prefix + entry.name + '/');
        }
      };
      const entries = [];
      for (const item of items) {
        const en = item.webkitGetAsEntry?.();
        if (en) entries.push(en);
      }
      if (entries.length) {
        for (const en of entries) await walk(en);
        await loadFiles(collected);
      } else {
        await loadFiles(dt.files);
      }
      renderTree();
      if (!current && files.size) {
        const readme = [...files.keys()].find((p) => /readme\.md$/i.test(p));
        showFile(readme || [...files.keys()][0]);
      }
    });

    searchEl.addEventListener('input', () => {
      searchQuery = searchEl.value;
      renderTree();
    });

    /* ---- theme ---- */
    const savedTheme = localStorage.getItem('md-theme');
    if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    const syncHljs = () => {
      const dark = document.documentElement.dataset.theme !== 'light';
      $('hljs-dark').disabled = !dark;
      $('hljs-light').disabled = dark;
      document.querySelector('meta[name="theme-color"]')
        .setAttribute('content', dark ? '#0d1117' : '#ffffff');
      // refresh mermaid theme if already loaded
      if (window.mermaid) {
        try {
          mermaid.initialize({
            startOnLoad: false,
            theme: dark ? 'dark' : 'default',
            securityLevel: 'loose',
            fontFamily: 'Inter, sans-serif',
          });
        } catch {}
      }
    };
    syncHljs();
    $('themeBtn').onclick = () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('md-theme', next);
      syncHljs();
    };

    $('clearBtn').onclick = async () => {
      if (!confirm('Clear all saved files from this device?')) return;
      await idbClear('files');
      await idbClear('meta');
      files.clear();
      current = null;
      docEl.innerHTML = '';
      docEl.hidden = true;
      emptyEl.hidden = false;
      filenameEl.textContent = 'No file loaded';
      filenameEl.classList.add('empty');
      tocListEl.innerHTML = '';
      searchEl.value = ''; searchQuery = '';
      renderTree();
      history.replaceState(null, '', location.pathname);
    };

    /* ============================================================
       PWA install
       ============================================================ */
    let deferredPrompt = null;
    const installBtn = $('installBtn');
    const isStandalone = () =>
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isStandalone()) installBtn.style.display = '';
    });

    installBtn.onclick = async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      if (outcome === 'accepted') installBtn.style.display = 'none';
    };

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
      deferredPrompt = null;
    });

    if (isStandalone()) installBtn.style.display = 'none';

    /* ============================================================
       Boot
       ============================================================ */
    (async function boot() {
      try {
        const stored = await idbGetAll('files');
        for (const rec of stored) {
          const type = rec.type || detectType(rec.path) || 'md';
          if (type === 'xlsx' && rec.data) {
            files.set(rec.path, { name: rec.path, type, data: rec.data });
          } else if (rec.content != null) {
            files.set(rec.path, { name: rec.path, type, content: rec.content });
          }
        }
      } catch {}

      renderTree();

      const fromHash = readHash();
      let lastFile = null;
      try { lastFile = await idbGet('meta', 'lastFile'); } catch {}

      if (fromHash && files.has(fromHash)) showFile(fromHash, { updateHash: false });
      else if (lastFile && files.has(lastFile)) showFile(lastFile, { updateHash: false });
      else if (files.size) {
        const readme = [...files.keys()].find((p) => /readme\.md$/i.test(p));
        showFile(readme || [...files.keys()][0]);
      }
    })();
  }
</script>
</body>
</html>
